<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Milu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales y fondo romántico */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Evita que la pantalla haga scroll cuando el botón se mueva */
        }

        /* Contenedor principal tipo tarjeta */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 450px;
            z-index: 10;
        }

        /* Título y texto */
        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            color: #590d22;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Imagen decorativa (gif de ositos tierno) */
        img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        /* Contenedor de los botones */
        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 60px; /* Mantiene el espacio aunque el botón No se vuelva absoluto */
        }

        /* Estilo base de los botones */
        button {
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        /* Botón SÍ - Atractivo y principal */
        #btn-si {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 8px 15px rgba(255, 77, 109, 0.4);
        }

        #btn-si:hover {
            transform: scale(1.05);
            background-color: #c9184a;
        }

        /* Botón NO - Secundario */
        #btn-no {
            background-color: #f8f9fa;
            color: #495057;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Ositos tiernos">
        <h1>¡Hola Milu! 💕</h1>
        <p>¿Quieres salir conmigo el día de mañana 11 de junio a las 5:00 PM a Minca?</p>
        
        <div class="botones">
            <button id="btn-si">¡Sí, obvio!</button>
            <button id="btn-no">No</button>
        </div>
    </div>

    <script>
        const btnSi = document.getElementById('btn-si');
        const btnNo = document.getElementById('btn-no');

        // Función para mover el botón de forma aleatoria
        function esquivarBoton() {
            // Cambiamos a posición fixed para que se mueva por toda la pantalla libremente
            btnNo.style.position = 'fixed';
            
            // Calculamos el espacio disponible asegurando que el botón no se salga de la pantalla
            const maxLeft = window.innerWidth - btnNo.offsetWidth - 20;
            const maxTop = window.innerHeight - btnNo.offsetHeight - 20;

            // Generamos posiciones aleatorias
            const randomLeft = Math.floor(Math.random() * maxLeft);
            const randomTop = Math.floor(Math.random() * maxTop);

            // Aplicamos las nuevas coordenadas
            btnNo.style.left = `${Math.max(10, randomLeft)}px`;
            btnNo.style.top = `${Math.max(10, randomTop)}px`;
        }

        // Eventos para desktop (pasar el mouse) y mobile (intentar tocar)
        btnNo.addEventListener('mouseover', esquivarBoton);
        btnNo.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Evita que se dispare el click en móviles
            esquivarBoton();
        });

        // Acción al hacer click en el botón Sí
        btnSi.addEventListener('click', function() {
            // Reemplazamos los espacios por %20 para la URL
            const mensaje = "Si,%20quiero,%20precioso.";
            // Agregamos el prefijo 57 para asegurar el enrutamiento a WhatsApp Colombia
            const numero = "573215669926"; 
            const url = `https://wa.me/${numero}?text=${mensaje}`;
            
            // Redirigimos a WhatsApp
            window.location.href = url;
        });
    </script>
</body>
</html>
